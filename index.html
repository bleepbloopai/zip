<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeros</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>0</text></svg>">
<style>
  :root {
    --paper: #f0f0f0;
    --ink: #111111;
    --faint: #d2d2d2;
    --accent: #111111;
    --accent-ink: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #111111;
      --ink: #eeeeee;
      --faint: #2e2e2e;
      --accent: #eeeeee;
      --accent-ink: #111111;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    overflow: hidden;
    position: relative;
  }
  .field {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 0;
    color: var(--faint);
    font-size: 22px;
    line-height: 1.15;
    white-space: pre-wrap;
    word-break: break-all;
    overflow: hidden;
    user-select: none;
    z-index: 0;
  }
  main {
    position: relative;
    z-index: 1;
    margin: 0 auto;
    width: min(32rem, calc(100% - 3rem));
    padding: 2rem;
    background: var(--paper);
    outline: 2px solid var(--ink);
  }
  h1 {
    margin: 0 0 .75rem;
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -.02em;
  }
  p { margin: 0 0 1.5rem; line-height: 1.55; max-width: 60ch; }
  label { display: block; font-size: .9rem; margin-bottom: .4rem; }
  .row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: stretch; }
  input[type="number"] {
    width: 8rem;
    padding: .7rem .8rem;
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--ink);
    border-radius: 0;
  }
  button {
    flex: 1 1 12rem;
    padding: .7rem 1.1rem;
    font: inherit;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: 2px solid var(--accent);
    border-radius: 0;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .6; cursor: progress; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  #status { min-height: 1.4em; margin: 1rem 0 0; font-size: .9rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <pre class="field" id="field" aria-hidden="true"></pre>

  <main>
    <h1>A file of zeros</h1>
    <p>Saves a plain text file that contains only the character 0, repeated. No line breaks, nothing else. It’s built in your browser, so nothing is uploaded.</p>

    <label for="mb">File size in MB</label>
    <div class="row">
      <input id="mb" type="number" min="1" step="1" value="100" inputmode="numeric">
      <button id="save" type="button">Save zeros.txt</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <noscript><p>This page needs JavaScript turned on to build the file.</p></noscript>
  </main>

<script>
(function () {
  // Decorative background of zeros
  document.getElementById('field').textContent = '0'.repeat(12000);

  var MB = 1024 * 1024;
  var btn = document.getElementById('save');
  var input = document.getElementById('mb');
  var statusEl = document.getElementById('status');

  btn.addEventListener('click', function () {
    var mb = Math.floor(Number(input.value));
    if (!isFinite(mb) || mb < 1) {
      statusEl.textContent = 'Enter a whole number of MB, 1 or higher.';
      return;
    }
    btn.disabled = true;
    statusEl.textContent = 'Building ' + mb + ' MB file…';

    // Build the file by doubling: a few blob pieces instead of millions
    function makeBlob(n) {
      var piece = new Blob([new Uint8Array(MB).fill(48)]); // 1 MB of "0" (byte 0x30)
      var result = null;
      while (n >= 1) {
        if (n % 2 === 1) result = result ? new Blob([result, piece]) : piece;
        n = Math.floor(n / 2);
        if (n >= 1) piece = new Blob([piece, piece]);
      }
      return result;
    }

    try {
      var blob = makeBlob(mb);
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'zeros.txt';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      statusEl.textContent = 'Saved zeros.txt (' + mb + ' MB, ' + (mb * MB).toLocaleString() + ' characters).';
    } catch (e) {
      statusEl.textContent = 'Your browser or device couldn’t build a file that large. Try a smaller size.';
    }
    btn.disabled = false;
  });
})();
</script>
</body>
</html>
